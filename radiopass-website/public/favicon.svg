<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RadioPass mark: the radiographic chain — focal spot, diverging beam,
       detector, and the one warm band where the image was formed. The body in
       the beam is dropped at this size (it closes up below ~22px). -->
  <rect width="64" height="64" rx="14" fill="#030A18"/>
  <path d="M14 32 L44 17 L44 47 Z" fill="#A4D1EC" opacity="0.14"/>
  <path d="M14 32 L44 17 M14 32 L44 47" stroke="#A4D1EC" stroke-width="2" opacity="0.6" fill="none"/>
  <line x1="47" y1="17" x2="47" y2="47" stroke="#A4D1EC" stroke-width="4" stroke-linecap="round"/>
  <line x1="47" y1="26" x2="47" y2="38" stroke="#D8A874" stroke-width="4" stroke-linecap="round"/>
  <circle cx="14" cy="32" r="4.2" fill="#F5FCFF"/>
</svg>
