<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RadioPass brand mark: the precessing moment. One vector tipped in a
       field, its cone hinted above — the image every module on both sites
       begins with. Amber on the chassis black; drawn, not photographed. -->
  <rect width="64" height="64" rx="14" fill="#0B0D10"/>
  <ellipse cx="32" cy="22" rx="14" ry="5" fill="none" stroke="#A8CBEA" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="32" y1="46" x2="45" y2="20.5" stroke="#D9A84E" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="45" cy="20.5" r="4.5" fill="#F2EEE6"/>
</svg>
