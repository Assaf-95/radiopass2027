<title>RadioPass Demo Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* RadioPass Demo Reel &mdash; a screening surface.
   Deliberately single-theme: this is a screen to be recorded, and a video has
   no light mode. Every colour is painted explicitly so the page holds on
   whatever ground the host puts behind it. Palette and faces are RadioPass's
   own, so the reel reads as the product rather than as something about it. */
:root{
  --ground:#07090D;      /* the portal's near-black, faintly blue-biased */
  --stage:#0E1218;
  --ink:#F2EEE6;         /* warm off-white &mdash; the site's --text-primary */
  --muted:#8B929B;
  --gold:#D9A84E;        /* the accent, spent only on the rail and the mark */
  --xray:#A8CBEA;
  --line:rgba(242,238,230,.10);
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow:hidden}
.reel{position:relative;width:100vw;height:100vh;display:grid;place-items:center;background:var(--ground)}
/* The stage holds a strict 16:9 so a screen recording crops predictably. */
.stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--stage);
  overflow:hidden}
.shot{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.shot.on{opacity:1}
.shot img{width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.03);transition:transform 7.5s linear}
.shot.on img{transform:scale(1.0)}
/* Lower third: a scrim so type stays legible over any frame. */
.scrim{position:absolute;inset:auto 0 0 0;height:62%;pointer-events:none;
  background:linear-gradient(to top,rgba(7,9,13,.97) 0%,rgba(7,9,13,.90) 26%,rgba(7,9,13,.55) 58%,transparent 100%)}
.cap{position:absolute;left:5.2%;right:5.2%;bottom:13.5%;pointer-events:none}
.cap-mark{display:flex;align-items:center;gap:.7em;margin:0 0 .55em;
  font-size:clamp(9px,1.05vw,13px);font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold)}
.cap-mark i{display:block;width:clamp(16px,2.2vw,30px);height:1px;background:var(--gold);opacity:.6}
.cap h2{margin:0 0 .3em;font-family:var(--display);font-weight:300;
  font-size:clamp(23px,4.15vw,60px);line-height:1.06;letter-spacing:-.018em;
  text-wrap:balance;max-width:19ch}
.cap p{margin:0;font-size:clamp(11px,1.42vw,20px);line-height:1.5;color:var(--muted);
  max-width:56ch;font-weight:400}
/* End card &mdash; the one place the second accent appears. */
.end{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
  gap:.5em;text-align:center;background:var(--ground);opacity:0;transition:opacity 1s ease;
  pointer-events:none}
.end.on{opacity:1}
.end h2{margin:0;font-family:var(--display);font-weight:300;
  font-size:clamp(30px,6.4vw,92px);letter-spacing:-.02em;line-height:1}
.end h2 em{font-style:normal;color:var(--xray)}
.end p{margin:0;font-size:clamp(11px,1.5vw,20px);color:var(--muted);letter-spacing:.02em}
.end .dom{margin-top:.9em;font-size:clamp(10px,1.15vw,15px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold)}
/* Progress rail &mdash; hairline, the reel's only persistent chrome. */
.rail{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(242,238,230,.09)}
.rail i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
/* Controls fade out while playing so a recording stays clean. */
.ctl{position:absolute;left:50%;bottom:clamp(10px,2.2vh,20px);transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:999px;
  background:rgba(14,18,24,.9);border:1px solid var(--line);
  backdrop-filter:blur(10px);opacity:1;transition:opacity .5s ease}
.reel.playing:not(:hover) .ctl{opacity:0}
.ctl button{appearance:none;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;
  transition:background .2s ease,color .2s ease}
.ctl button:hover{background:rgba(242,238,230,.09)}
.ctl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctl .go{background:var(--ink);color:var(--ground);font-weight:600;padding:6px 16px}
.ctl .go:hover{background:#fff}
.ctl .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  padding:0 8px;letter-spacing:.06em}
.hint{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);
  white-space:nowrap;font-size:11px;color:var(--muted);opacity:.75}
.reel.playing .hint{opacity:0;transition:opacity .4s ease}
@media (prefers-reduced-motion:reduce){
  .shot img,.shot.on img{transform:none;transition:none}
  .shot,.end{transition:none}
}
</style>
<div class="reel" id="reel">
  <div class="stage" id="stage">
    <div class="end" id="end">
      <h2>RadioPass<em>.</em></h2>
      <p>The First FRCR &mdash; anatomy and physics, prepared properly.</p>
      <p class="dom">radiopass.co.uk</p>
    </div>
    <div class="rail" aria-hidden="true"><i id="bar"></i></div>
  </div>
  <div class="ctl" id="ctl">
    <button class="go" id="play">Play</button>
    <button id="prev">Prev</button>
    <button id="next">Next</button>
    <span class="count" id="count">01 / 11</span>
    <button id="restart">Restart</button>
    <span class="hint">Press F for fullscreen, then Play. Space pauses, arrows step.</span>
  </div>
</div>

<script>
(function(){
  var SLIDES = window.__SLIDES__;
  var stage=document.getElementById('stage'), reel=document.getElementById('reel'),
      endCard=document.getElementById('end'), bar=document.getElementById('bar'),
      count=document.getElementById('count'), playBtn=document.getElementById('play'),
      rail=stage.querySelector('.rail');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TOTAL = SLIDES.length;

  /* Each shot is self-contained: image, its own scrim, its own caption. Stacking
     them inside one element is what lets a whole shot cross-fade as a unit --
     an earlier version kept the scrim and captions as siblings and had to
     re-parent them by hand to fix the z-order, which is a lot of moving parts
     for something the DOM will do for free. */
  var nodes = SLIDES.map(function(s){
    var d=document.createElement('div'); d.className='shot';
    var img=document.createElement('img'); img.src=s.img; img.alt='';
    if(reduced) img.style.transition='none';
    var scrim=document.createElement('div'); scrim.className='scrim'; scrim.setAttribute('aria-hidden','true');
    var cap=document.createElement('div'); cap.className='cap';
    var mark=document.createElement('p'); mark.className='cap-mark';
    var rule=document.createElement('i'); mark.appendChild(rule);
    mark.appendChild(document.createTextNode(s.n));
    var h2=document.createElement('h2'); h2.textContent=s.t;
    var p=document.createElement('p'); p.textContent=s.s;
    cap.appendChild(mark); cap.appendChild(h2); cap.appendChild(p);
    d.appendChild(img); d.appendChild(scrim); d.appendChild(cap);
    stage.insertBefore(d, endCard);
    return d;
  });

  var at=0, playing=false, timer=null, tick=null, t0=0, done=false;

  function paint(){
    nodes.forEach(function(n,i){ n.classList.toggle('on', i===at && !done); });
    endCard.classList.toggle('on', done);
    count.textContent = done ? pad(TOTAL)+' / '+pad(TOTAL)
                             : pad(at+1)+' / '+pad(TOTAL);
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function stop(){ clearTimeout(timer); clearInterval(tick); playing=false;
    reel.classList.remove('playing'); playBtn.textContent='Play'; }
  function run(){
    clearTimeout(timer); clearInterval(tick);
    if(done){ stop(); return; }
    var ms = SLIDES[at].d*1000;
    t0=Date.now(); bar.style.width='0%';
    tick=setInterval(function(){
      bar.style.width = Math.min(100,(Date.now()-t0)/ms*100)+'%';
    },100);
    timer=setTimeout(function(){
      if(at < TOTAL-1){ at++; paint(); run(); }
      else { done=true; paint(); bar.style.width='100%'; setTimeout(stop,3200); }
    }, ms);
  }
  function play(){ if(done){ done=false; at=0; paint(); }
    playing=true; reel.classList.add('playing'); playBtn.textContent='Pause'; run(); }
  /* Stepping one past the last shot lands on the end card, the same place the
     timer finishes -- otherwise Next simply stopped working on shot 11 and the
     card could only ever be seen by watching the whole reel through. */
  function go(n){ stop(); bar.style.width='0%';
    if(n >= TOTAL){ done=true; at=TOTAL-1; paint(); return; }
    done=false; at=Math.max(0,n); paint(); }

  playBtn.onclick=function(){ playing?stop():play(); };
  document.getElementById('next').onclick=function(){ go(at+1); };
  document.getElementById('prev').onclick=function(){ go(at-1); };
  document.getElementById('restart').onclick=function(){ go(0); play(); };
  addEventListener('keydown',function(e){
    if(e.key===' '){ e.preventDefault(); playing?stop():play(); }
    else if(e.key==='ArrowRight'){ go(at+1); }
    else if(e.key==='ArrowLeft'){ go(at-1); }
    else if(e.key==='f'||e.key==='F'){
      if(document.fullscreenElement) document.exitFullscreen();
      else if(reel.requestFullscreen) reel.requestFullscreen();
    }
  });
  paint();
})();
</script>
